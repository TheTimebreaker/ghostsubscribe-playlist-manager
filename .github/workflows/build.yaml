name: Build

on:
  push:
    tags:
      - "v*"
      - "test*"
  pull_request:

concurrency:
  group: build-and-release
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: sh

jobs:
  build:
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            os-label: Linux x86

          - os: macos-15
            os-label: macOS ARM

          - os: windows-2022
            os-label: Windows x86

    name: Build on ${{ matrix.os-label && format(' ({0})', matrix.os-label) }}
    runs-on: ${{ matrix.os }}
    env:
      BUILD_PREFIX: ghostsubscribe-playlist-manager_${{ github.event_name == 'pull_request' && format('test-pr-{0}', github.event.number) || github.ref_name }}
    steps:
      - name: Prepare build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "${env:RUNNER_TEMP}/upload"
          New-Item -Path ${dir} -ItemType Directory -Force
          $os = ${env:RUNNER_OS}.ToLower()
          $arch = uname -m
          $commonPath = "${dir}/${env:BUILD_PREFIX}_${os}_${arch}"
          Add-Content -Path ${env:GITHUB_ENV} -Value @"
          BUILD_ARTIFACT_DEFAULT=${commonPath}.zip
          BUILD_ARTIFACT_PORTABLE=${commonPath}_portable.zip
          "@ -Encoding utf8
      - name: Prepare build (non-Windows)
        if: runner.os != 'Windows'
        run: |
          dir=${RUNNER_TEMP}/upload
          mkdir -p "${dir}"
          os=$(
              tr '[:upper:]' '[:lower:]' <<EOF
          ${RUNNER_OS}
          EOF
          )
          arch=$(uname -m)
          common_path=${dir}/${BUILD_PREFIX}_${os}_${arch}
          artifact_default=${common_path}.tar.gz
          if [ "${RUNNER_OS}" = macOS ]; then
              artifact_portable=
          else
              artifact_portable=${common_path}_portable.tar.gz
              artifact_appimage=${common_path}.AppImage
          fi
          cat <<EOF >>"${GITHUB_ENV}"
          BUILD_ARTIFACT_DEFAULT=${artifact_default}
          ${artifact_portable:+BUILD_ARTIFACT_PORTABLE=${artifact_portable}}
          ${artifact_appimage:+BUILD_ARTIFACT_APPIMAGE=${artifact_appimage}}
          EOF
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v 7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: build

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libfontconfig1 \
            libfreetype6 \
            libdbus-1-3 \
            libglib2.0-0 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-cursor0 \
            libxext6 \
            libxrender1 \
            libxi6 \
            libxfixes3 \
            libxkbcommon-x11-0 \

      - parallel:
        - name: Run PyInstaller (Linux)
          if: runner.os == 'Linux'
          run: |
            uv run --no-managed-python pyinstaller --distpath dist/default --workpath build/default scripts/build.spec
            echo "REGULAR_EXE_PATH=./dist/default/ghostsubscribe-playlist-manager/ghostsubscribe-playlist-manager" >> "$GITHUB_ENV"
            echo "REGULAR_EXE_DIR=./dist/default/ghostsubscribe-playlist-manager/" >> "$GITHUB_ENV"
            tar czf "${BUILD_ARTIFACT_DEFAULT}" -C dist/default/ghostsubscribe-playlist-manager .

        - name: Run PyInstaller (Linux portable)
          if: runner.os == 'Linux'
          run: |
            uv run --no-managed-python pyinstaller --distpath dist/portable --workpath build/portable scripts/build.spec -- --portable
            echo "PORTABLE_EXE_PATH=./dist/portable/ghostsubscribe-playlist-manager" >> "$GITHUB_ENV"
            tar czf "${BUILD_ARTIFACT_PORTABLE}" -C dist/portable ghostsubscribe-playlist-manager

        - name: Run PyInstaller (macOS)
          if: runner.os == 'macOS'
          run: |
            uv run --no-managed-python pyinstaller scripts/build.spec
            echo "REGULAR_EXE_PATH=./dist/ghostsubscribe-playlist-manager.app/Contents/MacOS/ghostsubscribe-playlist-manager" >> "$GITHUB_ENV"
            tar czf "${BUILD_ARTIFACT_DEFAULT}" -C dist ghostsubscribe-playlist-manager.app


        - name: Run PyInstaller (Windows)
          if: runner.os == 'Windows'
          shell: pwsh
          run: |
            uv run --no-managed-python PyInstaller --distpath dist/default --workpath build/default scripts/build.spec
            Add-Content -Path $env:GITHUB_ENV -Value "REGULAR_EXE_PATH=.\dist\default\ghostsubscribe-playlist-manager\ghostsubscribe-playlist-manager.exe"
            Compress-Archive -Path dist/default/ghostsubscribe-playlist-manager -DestinationPath ${env:BUILD_ARTIFACT_DEFAULT}

        - name: Run PyInstaller (Windows portable)
          if: runner.os == 'Windows'
          shell: pwsh
          run: |
            uv run --no-managed-python PyInstaller --distpath dist/portable --workpath build/portable scripts/build.spec -- --portable
            Add-Content -Path $env:GITHUB_ENV -Value "PORTABLE_EXE_PATH=.\dist\portable\ghostsubscribe-playlist-manager.exe"
            Compress-Archive -Path dist/portable/ghostsubscribe-playlist-manager.exe -DestinationPath ${env:BUILD_ARTIFACT_PORTABLE}

      - name: Compile Linux AppImage
        if: runner.os == 'Linux'
        # jactionlint ignore=unverified-download
          # The upstream continuous build has no stable checksum to pin.
          # Revisit if upstream publishes verifiable checksums or attestations.
        run: |
          set -eu

          APP_NAME="ghostsubscribe-playlist-manager"
          APP_DIR="$REGULAR_EXE_DIR"
          APPIMAGE_DIR="$RUNNER_TEMP/${APP_NAME}.AppDir"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              APP_VERSION="$GITHUB_REF_NAME"
          else
              COMMIT_HASH="$(git rev-parse --short HEAD)"
              APP_VERSION="dev-${COMMIT_HASH}"
          fi

          mkdir -p "$APPIMAGE_DIR/usr/bin/$APP_NAME"
          cp -a "$APP_DIR/." "$APPIMAGE_DIR/usr/bin/$APP_NAME/"
          cp ./img/icon-Linux.png "$APPIMAGE_DIR/$APP_NAME.png"
          echo "$APP_VERSION" > "$APPIMAGE_DIR/VERSION"

          APPIMAGETOOL="${RUNNER_TEMP}/appimagetool-x86_64.AppImage"
          APPIMAGETOOL_URL="https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage"
          curl -fsSL -o "$APPIMAGETOOL" "$APPIMAGETOOL_URL" 
          chmod +x "$APPIMAGETOOL"
          

          # AppImage launcher
          cat > "$APPIMAGE_DIR/AppRun" <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/$APP_NAME/$APP_NAME" "\$@"
          EOF
          chmod +x "$APPIMAGE_DIR/AppRun"

          find "$APPIMAGE_DIR" -name "*.desktop" -print

          # Desktop entry
          cat > "$APPIMAGE_DIR/$APP_NAME.desktop" <<EOF
          [Desktop Entry]
          Name=GhostSubscribe Playlist Manager
          Exec=$APP_NAME
          Type=Application
          Categories=Utility;
          Icon=$APP_NAME
          X-AppImage-Name=$APP_NAME
          X-AppImage-Version=$APP_VERSION
          EOF

          echo "=== Desktop file ==="
          cat "$APPIMAGE_DIR/ghostsubscribe-playlist-manager.desktop"
          echo "===================="

          # Copy some Qt runtime dependencies
          mkdir -p "$APPIMAGE_DIR/usr/lib"
          cp /usr/lib/x86_64-linux-gnu/libEGL.so.1 "$APPIMAGE_DIR/usr/lib/" || true

          # Build AppImage
          "$APPIMAGETOOL" "$APPIMAGE_DIR" "$BUILD_ARTIFACT_APPIMAGE"

      - parallel:
          - name: Upload build artifact
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
              path: ${{ env.BUILD_ARTIFACT_DEFAULT }}
              if-no-files-found: error
              archive: false

          - name: Upload build artifact (portable)
            if: env.BUILD_ARTIFACT_PORTABLE != ''
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
              path: ${{ env.BUILD_ARTIFACT_PORTABLE }}
              if-no-files-found: error
              archive: false

          - name: Upload build artifact (AppImage)
            if: env.BUILD_ARTIFACT_APPIMAGE != ''
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
              path: ${{ env.BUILD_ARTIFACT_APPIMAGE }}
              if-no-files-found: error
              archive: false

  upload:
    timeout-minutes: 10
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')

    name: Upload Builds to Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          path: ${{ runner.temp }}/download
          merge-multiple: 'true'
          skip-decompress: 'true'

      - name: Create release and upload build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          DOWNLOAD_DIR: ${{ runner.temp }}/download
        run: |
          gh release create "$TAG_NAME" \
            "$DOWNLOAD_DIR"/* \
            --generate-notes

  build-successfull:
    name: Build Successful?
    timeout-minutes: 5
    needs: [build, upload]
    permissions: {}
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more test matrix jobs failed."
            exit 1
          fi
