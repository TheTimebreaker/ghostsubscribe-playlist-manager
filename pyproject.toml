[project]
name="ghostsubscribe-playlist-manager"
version="0.1.0"
description="A tool for effortlessly manage ghost subscriptions and playlists on YouTube"
authors=[{name="TheTimebreaker"}]
readme="README.md"
requires-python=">=3.15"
dependencies = [
    "google-api-python-client>=2.202.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "pydantic>=2.14.3",
    "pyside6>=6.12.0",
    "wget>=3.2",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "jactionlint>=2.5.0",
    "mypy>=2.4.1",
    "ruff>=0.17.4",
]
build = [
  "pyinstaller>=6.22.3",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
ghostsubscribe-playlist-manager = ["py.typed"]

[tool.ruff]
line-length = 150
target-version = "py315"
exclude = [
  ".venv",
  "build",
  "dist",
  "__pycache__",
  "__init__.py",
]
extension = { spec = "python" }

[tool.ruff.lint]
select = [
  "E",   # pycodestyle (errors)
  "F",   # pyflakes
  "I",   # isort (import sorting)
  "B",   # flake8-bugbear (extra checks for likely bugs)
  "UP",  # pyupgrade (modern Python syntax suggestions)
  "N",   # pep8-naming
  "ERA", # Mark commented out code
  "ANN", # Some type annotations
  "ASYNC", # Async checks
  "FIX",
  "ISC", # implicit str concat
  "ICN", # import conventions
  "G", #Logging format
  "INP", #implicit-no-pep420
  "PIE",
  "Q", #flake8-quotes
  "TD", #TODOs,
  "ARG", #Unused args
  "RUF", #Ruff specifics
]
extend-select = ["N815", "N816"]
ignore = [
  "ANN401", #allow type:Any
  "TD003", #Missing issue link for this TODOs
  "TD002", #Missing author in TODO
]


[tool.pylint."MASTER"]
disable = ["all"]


[tool.black]
line-length = 150
target-version = ["py315"]
include = '\.(pyi?|spec)$'


[tool.mypy]
python_version = "3.15"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
  "wget",
]
ignore_missing_imports = true
